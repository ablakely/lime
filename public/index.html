<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LIME Manuals</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header> 
      <nav class="navbar navbar-expand-lg navbar-dark bg-success fixed-top">
        <div class="container d-flex flex-wrap align-items-center gap-2">
          <a class="navbar-brand" href="/">
                <img src="/logo.png" alt="" width="32" height="32" class="d-inline-block align-text-top">
              LIME Manuals</a>
          <div class="navbar-search flex-grow-1">
            <input
              id="page-search"
              type="search"
              class="form-control form-control-sm"
              placeholder="Filter this page"
              aria-label="Filter items on this page"
              autocomplete="off"
            />
          </div>
          <div class="d-flex align-items-center gap-2">
            <a href="/" class="btn btn-outline-light btn-sm nav-icon-btn" aria-label="Home" title="Home">
              <i data-feather="home"></i>
            </a>
            <button
              id="toggle-quick-nav"
              type="button"
              class="btn btn-outline-light btn-sm nav-icon-btn"
              aria-label="Show manual finder"
              aria-pressed="true"
              title="Show manual finder"
            >
              <i data-feather="truck"></i>
            </button>
          </div>
        </div>
      </nav>
    </header>

    <main class="container mt-5 py-4">
      <section id="quick-nav-section" class="card shadow-sm mb-4 d-none">
        <div class="card-body">
          <h1 class="h4 mb-3">Find a Manual</h1>
          <form id="quick-nav-form" class="row g-2 align-items-end">
            <div class="col-12">
              <div class="d-flex justify-content-between align-items-center">
                <label for="quick-history" class="form-label mb-1">Recent cars</label>
                <button id="clear-quick-history" type="button" class="btn btn-link btn-sm p-0">Clear</button>
              </div>
              <select id="quick-history" class="form-select">
                <option value="">Choose a recent car</option>
              </select>
            </div>
            <div class="col-12 col-md-4">
              <label for="quick-make" class="form-label">Make</label>
              <div class="quick-nav-autocomplete">
                <input id="quick-make" class="form-control" autocomplete="off" />
                <div id="quick-make-menu" class="quick-nav-menu list-group shadow-sm d-none"></div>
              </div>
            </div>
            <div class="col-12 col-md-3">
              <label for="quick-year" class="form-label">Year</label>
              <div class="quick-nav-autocomplete">
                <input id="quick-year" class="form-control" autocomplete="off" />
                <div id="quick-year-menu" class="quick-nav-menu list-group shadow-sm d-none"></div>
              </div>
            </div>
            <div class="col-12 col-md-4">
              <label for="quick-model" class="form-label">Model/Engine</label>
              <div class="quick-nav-autocomplete">
                <input id="quick-model" class="form-control" autocomplete="off" />
                <div id="quick-model-menu" class="quick-nav-menu list-group shadow-sm d-none"></div>
              </div>
            </div>
            <div class="col-12 col-md-1 d-grid">
              <button type="submit" class="btn btn-primary">Go</button>
            </div>
          </form>
        </div>
      </section>

      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-3" id="breadcrumbs"></ol>
      </nav>

      <div id="message" class="alert d-none" role="alert"></div>
      <div id="search-empty-state" class="alert alert-light border d-none" role="status" aria-live="polite"></div>
      <div id="loading" class="text-center py-5 d-none">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 mb-0">Loading…</p>
      </div>
      <div id="content"></div>
    </main>

    <script src="/js/jquery.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/manual-response.js"></script>
    <script src="/js/route-utils.js"></script>
    <script src="/js/manual-url.js"></script>
    <script src="/js/manual-images.js"></script>
    <script src="/js/manual-sections.js"></script>
    <script src="/js/page-search.js"></script>
    <script src="/js/car-history.js"></script>
    <script src="/js/quick-nav-autocomplete.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
