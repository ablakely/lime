[package]
name = "lemon-website"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8.8", default-features = false, features = [ "http1", "tokio", "tower-log", "tracing" ] }
axum-extra = { version = "0.12.5", features = ["attachment"] }
clap = { version = "4.5.48", features = ["derive"] }
elsa = "1.11.2"
env_logger = "0.11.9"
governor = "0.10.4"
include_dir = "0.7.4"
lmdb-zero = "0.4.4"
log = "0.4.28"
memmap = "0.7.0"
oxidized-mtbl = { version = "0.1.0", path = "vendor/oxidized-mtbl", default-features = false, features = ["checksum", "zstd"] }
percent-encoding-rfc3986 = "0.1.3"
plait = "0.7.2"
real = { version = "0.1.4", features = ["axum"] }
regex = "1.12.3"
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
tokio-stream = "0.1.18"
tower = "0.5.3"
tower-default-headers = "0.2.3"
tower-serve-static = { version = "0.1.1", default-features = false }
zip = { version = "7.1.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
native-dialog = "0.9.6"

[profile.release]
overflow-checks = true
